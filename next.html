<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine Roadmap 💘</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png"
        href="https://static.vecteezy.com/system/resources/previews/067/451/164/non_2x/pixel-art-red-heart-icon-pixelated-heart-symbol-with-black-outline-love-sign-isolated-on-white-background-pixelated-red-heart-icon-valentine-icon-transparent-illustration-vector.jpg">

    <style>
        body {
            background-image: url('https://mir-s3-cdn-cf.behance.net/project_modules/disp/44613062079901.5e703d2cf3c89.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .roadmap {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .roadmap {
                flex-direction: column;
            }

            .arrow-horizontal {
                display: none;
            }

            .arrow-vertical {
                display: block;
            }
        }

        @media (min-width: 769px) {
            .arrow-vertical {
                display: none;
            }
        }

        .card {
            width: 260px;
            opacity: 0;
            transform: scale(0.85) translateY(20px);
            animation: reveal 0.6s ease forwards;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .arrow {
            font-size: 2rem;
            opacity: 0;
            animation: arrowFade 0.4s ease forwards, pulse 1.5s infinite;
        }

        @keyframes arrowFade {
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .pixel-border {
            border: 4px solid #fff;
            box-shadow:
                0 0 0 6px rgba(0, 0, 0, 0.8),
                inset 0 0 0 3px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center font-['Press_Start_2P'] p-6">

    <div class="roadmap">

        <!-- CARD 1 -->
        <div class="card bg-black/80 p-5 rounded-lg pixel-border text-center" style="animation-delay: 0s">
            <img src="https://www.vidnoz.com/bimg/cat-selfie-meme.gif"
                class="mx-auto w-32 h-32 rounded mb-3 object-cover">
            <p class="text-pink-400 text-xs mb-1">STEP 1</p>
            <p class="text-pink-200 text-[10px] leading-relaxed">
                Photobooth
            </p>
        </div>

        <!-- ARROW -->
        <div class="arrow arrow-horizontal text-pink-400" style="animation-delay: .6s">→</div>
        <div class="arrow arrow-vertical text-pink-400" style="animation-delay: .6s">↓</div>

        <!-- CARD 2 -->
        <div class="card bg-black/80 p-5 rounded-lg pixel-border text-center" style="animation-delay: 1.2s">
            <img src="https://media.tenor.com/3gPYmzZkvqMAAAAM/%D1%83%D1%82%D1%8E%D0%B3-cat-est.gif"
                class="mx-auto w-32 h-32 rounded mb-3 object-cover">
            <p class="text-pink-400 text-xs mb-1">STEP 2</p>
            <p class="text-pink-200 text-[10px] leading-relaxed">
                Eat lunch w my dinner
            </p>
        </div>

        <!-- ARROW -->
        <div class="arrow arrow-horizontal text-pink-400" style="animation-delay: 1.8s">→</div>
        <div class="arrow arrow-vertical text-pink-400" style="animation-delay: 1.8s">↓</div>

        <!-- CARD 3 -->
        <div class="card bg-black/80 p-5 rounded-lg pixel-border text-center" style="animation-delay: 2.4s">
            <img src="https://s.mltshp.com/r/1KKGQ"
                class="mx-auto w-32 h-32 rounded mb-3 object-cover">
            <p class="text-pink-400 text-xs mb-1">STEP 3</p>
            <p class="text-pink-200 text-[10px] leading-relaxed">
                Build Legos
            </p>
        </div>

        <!-- ARROW -->
        <div class="arrow arrow-horizontal text-pink-400" style="animation-delay: 3s">→</div>
        <div class="arrow arrow-vertical text-pink-400" style="animation-delay: 3s">↓</div>

        <!-- CARD 4 -->
        <div class="card bg-black/80 p-5 rounded-lg pixel-border text-center" style="animation-delay: 3.6s">
            <img src="https://i.pinimg.com/originals/0c/41/ac/0c41ac12262508e417edc9923fcae0d9.gif"
                class="mx-auto w-32 h-32 rounded mb-3 object-cover">
            <p class="text-pink-400 text-xs mb-1">STEP 4</p>
            <p class="text-pink-200 text-[10px] leading-relaxed">
                Oohh la laaa
            </p>
        </div>

    </div>

</body>

</html>
